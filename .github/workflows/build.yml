name: Build Windows & Android

on:
  workflow_dispatch:
    inputs:
      version:
        description: '发布 tag（如 v1.2.0）。留空则仅构建上传 artifact，不打 Release。'
        required: false
        default: ''
        type: string
      prerelease:
        description: '标记为预发布（pre-release）'
        required: false
        type: boolean
        default: false
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

jobs:
  windows:
    name: Windows (Electron)
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Windows app
        run: npm run electron:build

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: gitgreen-windows
          path: release/*.exe

  android:
    name: Android (APK)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Install dependencies
        run: npm ci

      - name: Build web assets
        run: npm run build

      - name: Copy web assets into APK project
        run: node scripts/copy-dist.js

      - name: Restore signing keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "No keystore secret configured, skipping release signing."
            exit 0
          fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/gitgreen-keystore.jks
          cp scripts/android-signing.gradle android/app/signing.gradle
          printf '\napply from: "signing.gradle"\n' >> android/app/build.gradle

      - name: Build APK
        env:
          ANDROID_KEYSTORE: gitgreen-keystore.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        working-directory: android
        run: gradle assembleDebug assembleRelease

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: gitgreen-android
          path: |
            android/app/build/outputs/apk/debug/*.apk
            android/app/build/outputs/apk/release/*.apk

  release:
    name: Publish Release
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.version != '')
    needs: [windows, android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist-artifacts
          merge-multiple: true

      - name: Resolve tag
        id: tag
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" && -n "${{ inputs.version }}" ]]; then
            TAG="${{ inputs.version }}"
            PRE="${{ inputs.prerelease }}"
          else
            TAG="${GITHUB_REF#refs/tags/}"
            PRE="false"
          fi
          if [[ "$TAG" == *-* ]]; then
            PRE="true"
          fi
          echo "name=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
          echo "prerelease=$PRE" >> "$GITHUB_OUTPUT"

      - name: Prepare release files
        run: |
          VERSION="${{ steps.tag.outputs.version }}"
          mkdir -p upload
          echo "Downloaded artifact tree:"
          find dist-artifacts -type f -print
          mapfile -t FILES < <(find dist-artifacts -type f | sort)
          for SRC in "${FILES[@]}"; do
            BASE=$(basename "$SRC")
            case "$BASE" in
              app-release.apk|*-release.apk)
                DEST="upload/GitGreen-${VERSION}.apk"
                ;;
              app-debug.apk|*-debug.apk)
                DEST="upload/GitGreen-${VERSION}-debug.apk"
                ;;
              *)
                DEST="upload/$BASE"
                ;;
            esac
            cp "$SRC" "$DEST"
            echo "Prepared $DEST from $SRC"
          done
          ls -lh upload/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.name }}
          files: upload/*
          draft: false
          prerelease: ${{ steps.tag.outputs.prerelease }}
          generate_release_notes: true
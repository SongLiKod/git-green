// 由 CI 在检测到 ANDROID_KEYSTORE_BASE64 时复制到 android/app/signing.gradle 并 apply
android {
    signingConfigs {
        release {
            storeFile file(System.getenv("ANDROID_KEYSTORE") ?: "gitgreen-keystore.jks")
            storePassword System.getenv("ANDROID_KEYSTORE_PASSWORD")
            keyAlias System.getenv("ANDROID_KEY_ALIAS")
            keyPassword System.getenv("ANDROID_KEY_PASSWORD")
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }
}